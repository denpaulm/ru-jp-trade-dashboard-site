<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>Торговля Россия — Япония</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  /* токены, которые на платформе Claude задаёт оболочка дашборда */
  :root {
    --color-fg: #1d1d1f; --color-fg-muted: #66666d; --color-bg: #ffffff; --color-panel: #f7f7f8; --color-border-line: #e2e2e6;
    --color-ok: #1a7f43; --color-warn: #a35f00; --color-bad: #c0392b;
    --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 28px; --cds-font-weight-medium: 500;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 20px; --cds-gap-xl: 32px;
    --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 16px; --cds-pad-xl: 24px; --cds-radius: 8px;
    --cds-surface-popover: #ffffff; --cds-border: #dcdce0; --cds-shadow-popover: 0 4px 16px rgba(0, 0, 0, .12); --cds-text-secondary: #66666d;
    --cds-chart-grid: #ececef; --cds-chart-axis: #b8b8be; --cds-chart-reference: #9a9aa0; --cds-chart-muted: #c8c8cc;
    --cds-dur-slow: 300ms; --cds-ease-out: cubic-bezier(.2, .8, .2, 1);
    --font-anthropic-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-anthropic-serif: Georgia, "Times New Roman", "Hiragino Mincho ProN", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-fg: #ececef; --color-fg-muted: #a3a3aa; --color-bg: #161618; --color-panel: #1f1f22; --color-border-line: #333338;
      --color-ok: #4cc27f; --color-warn: #e0a24a; --color-bad: #ef6b5e;
      --cds-surface-popover: #26262a; --cds-border: #3a3a40; --cds-shadow-popover: 0 4px 16px rgba(0, 0, 0, .5); --cds-text-secondary: #a3a3aa;
      --cds-chart-grid: #2c2c31; --cds-chart-axis: #55555c; --cds-chart-reference: #77777e; --cds-chart-muted: #4a4a50;
      color-scheme: dark;
    }
  }
  html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: 14px; }
  #dash-root { max-width: 1440px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
  .dash-skeleton { min-height: 1em; background: var(--color-panel); border-radius: 6px; color: transparent !important; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="dash-root">
<style>
  /* Layout: OEC-style — control panel on the left, two mirrored treemaps on the right;
     below them the selected item (trend + card), the port map, and the product table */
  .rj {
    --rj-pick: #f6c343;
    --rj-pick-ink: #1c1a14;
    --rj-track: color-mix(in srgb, var(--color-fg) 6%, transparent);
    --rj-sea: color-mix(in srgb, var(--color-fg) 4%, var(--color-panel));
    --rj-land: var(--color-bg);
    --rj-land-other: color-mix(in srgb, var(--color-fg) 9%, var(--color-panel));
    font-family: var(--font-anthropic-sans);
    display: grid;
    gap: var(--cds-gap-lg);
    font-variant-numeric: tabular-nums;
  }
  .rj-head { display: grid; gap: var(--cds-gap-xs); }
  .rj-head h1 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; text-wrap: balance; }
  .rj-take { margin: 0; color: var(--color-fg-muted); max-width: 72ch; }
  .rj-take b, .rj-sum b { font-weight: 600; color: var(--color-fg); }

  .rj-wrap { container-type: inline-size; }
  .rj-main { display: grid; gap: var(--cds-gap-lg); grid-template-columns: 1fr; }
  @container (min-width: 1080px) { .rj-main { grid-template-columns: minmax(240px, 280px) minmax(0, 1fr); } }

  .rj-panel { display: grid; gap: var(--cds-gap-md); align-content: start; min-width: 0; }
  .rj-panel h2 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
  .rj-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--rj-track); border-radius: 999px; padding: 3px; }
  .rj-seg button { font: inherit; font-size: var(--cds-font-size-body); color: var(--color-fg); background: transparent; border: 0; border-radius: 999px; padding: 6px 8px; cursor: pointer; }
  .rj-seg button[aria-pressed="true"] { background: var(--rj-pick); color: var(--rj-pick-ink); font-weight: 600; }
  .rj button:focus-visible, .rj select:focus-visible, .rj input:focus-visible, .rj-tile:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
  .rj-period { font: inherit; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: 999px; padding: 8px 14px; width: 100%; }
  .rj-crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: var(--cds-font-size-caption); min-height: 1.6em; }
  .rj-crumbs button, .rj-link { font: inherit; background: none; border: 0; padding: 2px 0; color: var(--color-fg); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .rj-crumbs span[aria-current] { color: var(--color-fg-muted); }
  .rj-crumbs .sep { color: var(--color-fg-muted); }
  .rj-sum { margin: 0; line-height: 1.55; color: var(--color-fg-muted); }
  .rj-hint { margin: 0; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); line-height: 1.5; }

  .rj-maps { container-type: inline-size; min-width: 0; }
  .rj-maps-grid { display: grid; gap: var(--cds-gap-lg); grid-template-columns: 1fr; }
  @container (min-width: 620px) { .rj-maps-grid { grid-template-columns: 1fr 1fr; } .rj-legend { grid-column: 1 / -1; } }
  .rj-map { margin: 0; display: grid; gap: var(--cds-gap-xs); position: relative; min-width: 0; }
  .rj-map h3 { margin: 0; text-align: center; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); text-wrap: balance; }
  .rj-total { text-align: center; color: var(--color-fg-muted); }
  .rj-total b { font-family: var(--font-anthropic-serif); font-weight: 400; color: var(--color-fg); font-size: 1.15em; }
  .rj-tm { position: relative; min-height: 340px; }
  .rj-tm svg { display: block; }
  .rj-tile { cursor: pointer; outline: none; }
  .rj-tile rect { stroke: transparent; stroke-width: 2; }
  .rj-tile:hover rect { stroke: var(--color-fg); }
  .rj-tile.sel rect { stroke: var(--color-fg); stroke-width: 3; }
  .rj-tm svg.dim .rj-tile:not(.sel) { opacity: .42; }
  .rj-empty { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); border: 1px dashed var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md); text-align: center; }
  .rj-dot { width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); flex: none; }

  .rj-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: var(--cds-font-size-caption); }
  .rj-legend button { font: inherit; display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 2px 0; color: var(--color-fg); cursor: pointer; }
  .rj-legend button[aria-pressed="true"] { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .rj-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
  .rj-grad { display: flex; align-items: center; gap: 8px; }
  .rj-grad i { width: 160px; max-width: 40vw; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #b83232, #9aa0a6, #23864b); }

  .rj-selbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-sm); padding: var(--cds-pad-sm) var(--cds-pad-md); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-panel); }
  .rj-selbar .what { flex: 1 1 260px; min-width: 0; }
  .rj-selbar .what b { font-weight: 600; }
  .rj-btn { font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .rj-btn.pick { background: var(--rj-pick); color: var(--rj-pick-ink); border-color: transparent; font-weight: 600; }

  .rj-tip {
    position: absolute; z-index: 5; pointer-events: none; max-width: 320px;
    background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius);
    box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption);
    display: grid; gap: 2px;
  }
  .rj-tip .k { color: var(--cds-text-secondary); }
  .rj-tip .n { font-weight: 600; }
  .rj-tip .row { display: flex; justify-content: space-between; gap: 12px; }

  .rj-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); display: grid; gap: var(--cds-gap-sm); min-width: 0; align-content: start; }
  .rj-card h2 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
  .rj-note { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .rj-row2 { container-type: inline-size; }
  .rj-row2-grid { display: grid; gap: var(--cds-gap-lg); grid-template-columns: 1fr; }
  @container (min-width: 900px) { .rj-row2-grid { grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); } }
  .rj-trend { position: relative; min-height: 300px; }
  .rj-trend svg { display: block; overflow: visible; }

  .rj-item { display: grid; gap: var(--cds-gap-sm); }
  .rj-item .code { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .rj-item h3 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: 600; text-wrap: balance; }
  .rj-item .orig { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .rj-kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; margin: 0; font-size: var(--cds-font-size-caption); }
  .rj-kv dt { color: var(--color-fg-muted); }
  .rj-kv dd { margin: 0; text-align: right; font-weight: 500; }
  .rj-flag { margin: 0; padding: var(--cds-pad-xs) var(--cds-pad-sm); border-radius: var(--cds-radius); background: var(--rj-track); font-size: var(--cds-font-size-caption); line-height: 1.5; }
  .rj-leads { display: grid; gap: 4px; font-size: var(--cds-font-size-caption); line-height: 1.5; }
  .rj-leads h4 { margin: 0; font-size: var(--cds-font-size-caption); font-weight: 600; }
  .rj-leads p { margin: 0; }
  .rj-leads ul { margin: 0; padding-left: 1.1em; }
  .rj-leads a { color: var(--color-fg); }

  .rj-ports { container-type: inline-size; }
  .rj-ports-grid { display: grid; gap: var(--cds-gap-lg); grid-template-columns: 1fr; }
  @container (min-width: 820px) { .rj-ports-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }
  .rj-pmap { position: relative; min-height: 360px; width: 100%; max-width: 580px; justify-self: center; }
  .rj-pmap svg { display: block; border-radius: var(--cds-radius); }
  .rj-bubble { cursor: pointer; }
  .rj-bubble circle { fill-opacity: .5; stroke-width: 1.5; }
  .rj-bubble:hover circle, .rj-bubble.sel circle { fill-opacity: .85; stroke: var(--color-fg); }
  .rj-plabel { font-size: 23px; fill: var(--color-fg); paint-order: stroke; stroke: var(--rj-sea); stroke-width: 6px; stroke-linejoin: round; pointer-events: none; }
  .rj-plist { display: grid; gap: 2px; align-content: start; min-width: 0; }
  .rj-prow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, 34%) auto; gap: 4px 10px; align-items: center; width: 100%; font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); text-align: left; background: none; border: 0; border-radius: var(--cds-radius); padding: 6px 8px; cursor: pointer; }
  .rj-prow:hover, .rj-prow[aria-pressed="true"] { background: var(--rj-track); }
  .rj-prow .nm { min-width: 0; }
  .rj-prow .nm small { display: block; color: var(--color-fg-muted); }
  .rj-prow .bar { height: 8px; border-radius: 4px; background: var(--rj-track); overflow: hidden; }
  .rj-prow .bar i { display: block; height: 100%; border-radius: 4px; }
  .rj-prow .v { text-align: right; white-space: nowrap; }
  .rj-prow .v small { display: block; color: var(--color-fg-muted); }
  .rj-plist-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .rj-plist-head h3 { margin: 0; font-size: var(--cds-font-size-body); font-weight: 600; }

  .rj-tools { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: center; justify-content: space-between; }
  .rj-tabs { display: inline-grid; grid-auto-flow: column; background: var(--rj-track); border-radius: 999px; padding: 3px; }
  .rj-tabs button { font: inherit; background: transparent; border: 0; border-radius: 999px; padding: 5px 12px; color: var(--color-fg); cursor: pointer; }
  .rj-tabs button[aria-selected="true"] { background: var(--rj-pick); color: var(--rj-pick-ink); font-weight: 600; }
  .rj-tabs button:disabled { cursor: default; opacity: .55; }
  .rj-search { font: inherit; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: 999px; padding: 6px 12px; min-width: 0; flex: 1 1 200px; max-width: 320px; }
  .rj-tablebox { max-height: 560px; overflow: auto; border-top: 1px solid var(--color-border-line); }
  .rj-table { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-caption); }
  .rj-table th { position: sticky; top: 0; background: var(--color-panel); text-align: right; font-weight: var(--cds-font-weight-medium); padding: 0; z-index: 1; }
  .rj-table th button { font: inherit; width: 100%; text-align: inherit; background: none; border: 0; padding: 8px 6px; color: var(--color-fg-muted); cursor: pointer; white-space: nowrap; }
  .rj-table th[aria-sort] button { color: var(--color-fg); }
  .rj-table td { padding: 6px; border-top: 1px solid var(--color-border-line); text-align: right; white-space: nowrap; }
  .rj-table th.l, .rj-table td.l { text-align: left; }
  .rj-table td.name { white-space: normal; min-width: 180px; }
  .rj-table td.name small { display: block; color: var(--color-fg-muted); }
  .rj-table tbody tr { cursor: pointer; }
  .rj-table tbody tr:hover td, .rj-table tbody tr.sel td { background: var(--rj-track); }
  .rj-drill { font: inherit; background: none; border: 1px solid var(--color-border-line); border-radius: 4px; color: var(--color-fg); padding: 0 5px; margin-left: 6px; cursor: pointer; }
  .rj-sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
  .rj-pos { color: var(--color-ok); }
  .rj-neg { color: var(--color-bad); }
  @media (max-width: 720px) { .rj-table .opt { display: none; } }
  .rj-foot { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.5; max-width: 110ch; }

  [data-dash-source-state=empty] { color: transparent; }
  [data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
  @media (prefers-reduced-motion: no-preference) {
    .rj-tm svg.fresh .rj-tile { animation: rj-in var(--cds-dur-slow) var(--cds-ease-out) both; }
    @keyframes rj-in { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
<style>
  .rj-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: var(--cds-gap-sm); }
  .rj-langs { display: inline-grid; grid-auto-flow: column; background: var(--rj-track); border-radius: 999px; padding: 3px; flex: none; }
  .rj-langs button { font: inherit; font-size: var(--cds-font-size-caption); background: transparent; border: 0; border-radius: 999px; padding: 5px 12px; color: var(--color-fg); cursor: pointer; }
  .rj-langs button[aria-pressed="true"] { background: var(--rj-pick); color: var(--rj-pick-ink); font-weight: 600; }
  .rj:lang(ja) { line-break: strict; }
  .rj [hidden] { display: none !important; }
  .rj-back { font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: 999px; padding: 3px 10px; margin-right: 6px; cursor: pointer; }
  .rj-nav { font-size: var(--cds-font-size-body); }
  .rj-pages { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border-line); margin-top: var(--cds-gap-sm); }
  .rj-pages button { font: inherit; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; color: var(--color-fg-muted); cursor: pointer; margin-bottom: -1px; }
  .rj-pages button[aria-selected="true"] { color: var(--color-fg); border-bottom-color: var(--rj-pick); font-weight: 600; }
  .rj-page { display: grid; gap: var(--cds-gap-lg); }
  .rj-about { display: grid; gap: var(--cds-gap-lg); max-width: 78ch; line-height: 1.6; }
  .rj-about h2 { margin: 0; font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); }
  .rj-about h3 { margin: 0 0 4px; font-size: var(--cds-font-size-heading); font-weight: 600; }
  .rj-about p { margin: 0; }
  .rj-about ul { margin: 4px 0 0; padding-left: 1.2em; display: grid; gap: 4px; }
  .rj-about a { color: var(--color-fg); }
  .rj-head2 { display: grid; gap: var(--cds-gap-xs); }
  .rj-head2 h2 { margin: 0; font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); }
  .rj-kpis { display: flex; flex-wrap: wrap; gap: var(--cds-gap-lg); }
  .rj-kpi { display: grid; gap: 2px; min-width: 120px; }
  .rj-kpi b { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); }
  .rj-kpi span { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .rj-ctools { justify-content: flex-start; }
  .rj-csel { width: auto; max-width: 100%; min-width: 0; flex: 0 1 280px; }
  .rj-ctable td { white-space: normal; vertical-align: top; }
  .rj-ctable td.nw { white-space: nowrap; }
  .rj-ctable td small { display: block; color: var(--color-fg-muted); }
  .rj-chip { display: inline-block; font: inherit; font-size: var(--cds-font-size-caption); border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); border-radius: 999px; padding: 1px 8px; margin: 0 4px 4px 0; cursor: pointer; }
  .rj-chip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .rj-badge { display: inline-block; font-size: var(--cds-font-size-caption); font-weight: 600; border-radius: 4px; padding: 1px 6px; background: var(--rj-pick); color: var(--rj-pick-ink); }
  .rj-warn { display: inline-block; font-size: var(--cds-font-size-caption); color: var(--color-warn); }
  .rj-sources ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: var(--cds-font-size-caption); line-height: 1.5; }
  .rj-sources b { font-weight: 600; }
</style>

<div class="rj" lang="ru">
  <header class="rj-head" id="top">
    <div class="rj-top">
      <h1 id="title" data-i18n="title">Торговля Россия — Япония по товарам</h1>
      <div class="rj-langs" role="group" data-i18n-aria="ariaLang" aria-label="Язык" id="langs">
        <button type="button" data-v="ru" lang="ru">RU</button>
        <button type="button" data-v="en" lang="en">EN</button>
        <button type="button" data-v="ja" lang="ja">日本語</button>
      </div>
    </div>
    <nav class="rj-pages" role="tablist" data-i18n-aria="ariaPages" id="pages">

<script>
  // Замена объекта `dash` платформы Claude: те же методы, данные — из файлов site/data/.
  (function () {
    const files = {trade: 'trade.csv', products: 'products.csv', ports: 'ports.csv', offices: 'offices.csv', basemap: 'basemap.json', companies: 'companies.csv'};
    const store = {}, status = {}, calcs = {}, order = [], handlers = [];
    const run = () => handlers.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
    window.dash = {
      colors: ['#2f6fdf', '#e07a1f', '#2a9d8f', '#9b5de5', '#e63946', '#457b9d', '#f4a261', '#6c757d'],
      data(id) {
        if (id in store) return { status: 'ok', data: store[id], meta: [], refreshing: false };
        return { status: status[id] || 'loading', data: [], meta: [], refreshing: false };
      },
      calc(id, def) { calcs[id] = def; order.push(id); },
      loader() {},
      onData(fn) { handlers.push(fn); try { fn(); } catch (e) { console.error(e); } },
      params() { return {}; }, setParams() {}, resetParams() {}, refresh() {},
      setLink(name) { try { history.replaceState(null, '', '#' + name); } catch (e) { /* file:// */ } },
    };
    window.__loadDashData = async () => {
      await Promise.all(Object.entries(files).map(async ([id, f]) => {
        try {
          const r = await fetch('data/' + f);
          if (!r.ok) throw new Error(r.status);
          const t = await r.text();
          store[id] = f.endsWith('.json') ? JSON.parse(t) : d3.csvParse(t);
        } catch (e) { status[id] = 'error'; console.error('data', id, e); }
      }));
      // расчёты по порядку объявления: каждый получает строки своих входов
      for (const id of order) {
        const c = calcs[id];
        if (c.inputs.every((i) => i in store)) {
          try { store[id] = c.fn(...c.inputs.map((i) => store[i])); } catch (e) { status[id] = 'error'; console.error('calc', id, e); }
        } else status[id] = 'error';
      }
      run();
    };
  })();
</script>
<script>
  // ---- calculations (visible to readers in Sources) ----
  dash.calc('periods', {
    inputs: ['trade'],
    title: 'Периоды для выбора',
    description: 'Полные годы, «с начала года» и «последние 12 месяцев» из помесячных данных, с периодом для сравнения.',
    fn: (trade) => {
      const months = [...new Set(trade.map((r) => r.month))].sort();
      const has = new Set(months);
      const [ly, lm] = months[months.length - 1].split('-').map(Number);
      const ym = (y, m) => new Date(Date.UTC(y, m - 1, 1)).toISOString().slice(0, 7);
      const span = (y, m, n) => Array.from({ length: n }, (_, i) => ym(y, m - i)).reverse();
      const years = [...new Set(months.map((m) => m.slice(0, 4)))].filter((y) => span(+y, 12, 12).every((m) => has.has(m))).sort().reverse();
      const out = [];
      const add = (period, kind, src, prev) => {
        if (src.every((p) => has.has(p))) out.push({ period, kind, src: src.join(','), prev, first: src[0], last: src[src.length - 1] });
      };
      add('ytd' + ly, 'ytd', span(ly, lm, lm), 'ytd' + (ly - 1));
      add('ltm', 'ltm', span(ly, lm, 12), 'ltm_prev');
      years.forEach((y) => add(y, 'year', span(+y, 12, 12), String(+y - 1)));
      add('ytd' + (ly - 1), 'ytd', span(ly - 1, lm, lm), null);
      add('ltm_prev', 'ltm', span(ly - 1, lm, 12), null);
      const ids = new Set(out.map((p) => p.period));
      return out.map((p) => ({ ...p, prev: ids.has(p.prev) ? p.prev : '' }));
    },
  });

  dash.calc('views', {
    inputs: ['trade', 'products', 'periods'],
    title: 'Товары по периодам',
    description: 'Суммы помесячных строк HS9 по секциям, главам HS2, позициям HS4, HS6 и HS9 за каждый период; доля в потоке, прошлый период и изменение; названия на трёх языках.',
    fn: (trade, products, periods) => {
      const prod = new Map(products.map((p) => [p.level === '9' ? p.flow + '|' + p.code : p.code, p]));
      const sec = (c) => (prod.get(c.slice(0, 2)) || {}).section || '22';
      const byMonth = new Map();
      trade.forEach((r) => { if (!byMonth.has(r.month)) byMonth.set(r.month, []); byMonth.get(r.month).push(r); });
      const acc = new Map();
      const add = (pid, flow, level, code, v, kg) => {
        const key = `${pid}|${flow}|${code}`;
        let o = acc.get(key);
        if (!o) acc.set(key, (o = { key, period: pid, flow, level, code, value: 0, kg: 0 }));
        o.value += v;
        o.kg += kg;
      };
      periods.forEach((p) => p.src.split(',').forEach((m) => (byMonth.get(m) || []).forEach((r) => {
        const v = +r.value, kg = +r.kg, c = r.hs9;
        add(p.period, r.flow, 0, 'TOTAL', v, kg);
        add(p.period, r.flow, 1, 'S' + sec(c), v, kg);
        add(p.period, r.flow, 2, c.slice(0, 2), v, kg);
        add(p.period, r.flow, 4, c.slice(0, 4), v, kg);
        add(p.period, r.flow, 6, c.slice(0, 6), v, kg);
        add(p.period, r.flow, 9, c, v, kg);
      })));
      // позиции, которые были в прошлом периоде, но выпали в текущем
      for (const p of periods) {
        if (!p.prev) continue;
        for (const o of [...acc.values()]) {
          if (o.period !== p.prev) continue;
          const key = `${p.period}|${o.flow}|${o.code}`;
          if (!acc.has(key)) acc.set(key, { key, period: p.period, flow: o.flow, level: o.level, code: o.code, value: 0, kg: 0 });
        }
      }
      const prevOf = new Map(periods.map((p) => [p.period, p.prev]));
      const codeWord = { ru: ' · код ', en: ' · code ', ja: '・コード' };
      return [...acc.values()].map((o) => {
        const total = acc.get(`${o.period}|${o.flow}|TOTAL`).value;
        const pk = prevOf.get(o.period);
        const prev = pk ? (acc.get(`${pk}|${o.flow}|${o.code}`) || { value: 0 }).value : null;
        const p = (o.level === 9 ? prod.get(o.flow + '|' + o.code) : prod.get(o.code)) || {};
        const parent = o.level === 9 ? prod.get(o.code.slice(0, 6)) || {} : {};
        const name = (l) => p['name_' + l] || (o.level === 9 ? (parent['name_' + l] || o.code.slice(0, 6)) + codeWord[l] + o.code.slice(6) : o.code);
        return {
          ...o,
          section: o.level === 1 ? o.code.slice(1) : o.level === 0 ? '' : sec(o.code),
          name_ru: name('ru'), name_en: name('en'), name_ja: name('ja'),
          share: total ? o.value / total : 0,
          prev,
          change: prev === null ? null : o.value - prev,
          growth: prev ? o.value / prev - 1 : null,
          price: o.kg > 0 ? o.value / o.kg : null,
        };
      });
    },
  });

  dash.calc('balance', {
    inputs: ['views'],
    title: 'Сальдо торговли',
    description: 'Экспорт России в Японию минус экспорт Японии в Россию за каждый период.',
    fn: (views) => {
      const t = views.filter((r) => r.level === 0);
      const periods = [...new Set(t.map((r) => r.period))];
      return periods.map((period) => {
        const ex = (t.find((r) => r.period === period && r.flow === 'ru_jp') || { value: 0 }).value;
        const im = (t.find((r) => r.period === period && r.flow === 'jp_ru') || { value: 0 }).value;
        return { period, exports: ex, imports: im, balance: ex - im };
      });
    },
  });
</script>

  $('#seg-level').addEventListener('click', (e) => {

  $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { st.tab = b.dataset.v; drawTable(); segs(); } });
  $('#port-tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !st.sel) { st.portFlow = b.dataset.v; st.port = null; drawPorts(); segs(); } });

  function toggleSel(flow, r) {
    const same = st.sel && st.sel.flow === flow && st.sel.code === r.code;
    st.sel = same ? null : { flow, level: r.level, code: r.code };
    st.port = null;

  // each change of filter or level remembers the previous view, so «Back» can retrace the path step by step
  const steps = [];
  function remember() {
    steps.push({ filter: st.filter, level: st.level });
    if (steps.length > 50) steps.shift();
  }
  function goBack() {
    const prev = steps.pop();
    if (!prev) return;
    st.filter = prev.filter;
    st.level = prev.level;
    st.sel = null;
    st.port = null;
    draw();
  }
  function drill(code) {
    if (!drillable(code)) return;
    remember();
    st.filter = { type: 'code', code };
    st.level = Math.max(st.level, nextLevel(code.length));
    st.sel = null;
    st.port = null;
    draw();
  }
  // a single click selects, a double click drills down; the short wait tells them apart
  let clickTimer = null, clickId = null;
  function onTileClick(flow, r) {
    const id = flow + '|' + r.code;
    if (clickTimer && clickId === id) { clearTimeout(clickTimer); clickTimer = null; drill(r.code); return; }
    clearTimeout(clickTimer);
    clickId = id;
    clickTimer = setTimeout(() => { clickTimer = null; toggleSel(flow, r); }, 260);
  }

  function drawCrumbs() {
    ['#crumbs', '#table-crumbs'].forEach((id) => drawNav($(id)));

  function drawNav(nav) {
    nav.replaceChildren();

      const back = el('button', 'rj-back', L().back); back.type = 'button';
      back.setAttribute('aria-label', L().backAria);
      back.addEventListener('click', goBack);
      nav.append(back);
    }
    let crumbs = 0;
    const crumb = (label, filter, current) => {
      if (crumbs++) nav.append(el('span', 'sep', '›'));
      if (current) { const s = el('span', '', label); s.setAttribute('aria-current', 'true'); nav.append(s); return; }
      const b = el('button', '', label); b.type = 'button';
      b.addEventListener('click', () => { remember(); st.filter = filter; st.sel = null; st.level = filter ? nextLevel(filter.code.length) : Math.min(st.level, 4); draw(); });
      nav.append(b);
    };
    crumb(L().allGoods, null, !st.filter);
    if (!st.filter) return;
    if (st.filter.type === 'section') { crumb(secName(st.filter.id), st.filter, true); return; }
    const c = st.filter.code;
    for (const n of [2, 4, 6]) {
      if (n > c.length) break;
      crumb(`${c.slice(0, n)} ${codeName(c.slice(0, n))}`.trim(), { type: 'code', code: c.slice(0, n) }, n === c.length);
    }
  }

  // ---- treemap ----
  const ctx = document.createElement('canvas').getContext('2d');
  const family = getComputedStyle(root).fontFamily;
  // measured with a small margin: the SVG may render a hair wider than the canvas estimate
  const textW = (t, fs, wt) => { ctx.font = `${wt} ${fs}px ${family}`; return ctx.measureText(t).width * 1.07; };
  // Japanese has no spaces, so it wraps between characters; other languages wrap between words
  function wrap(text, maxW, fs, wt, maxLines) {
    const cjk = st.lang === 'ja';
    const toks = cjk ? Array.from(text) : text.split(/\s+/);
    const glue = cjk ? '' : ' ';
    const lines = [];
    let cur = '', used = 0;
    for (const w of toks) {
      const t = cur ? cur + glue + w : w;
      if (textW(t, fs, wt) <= maxW) { cur = t; used++; continue; }
      if (cur) lines.push(cur);
      if (lines.length >= maxLines) { cur = ''; break; }
      cur = w; used++;
    }
    if (cur && lines.length < maxLines) lines.push(cur);
    else if (cur) used--;
    if (lines.slice(0, -1).some((l) => textW(l, fs, wt) > maxW)) return null;
    if (used < toks.length || lines.some((l) => textW(l, fs, wt) > maxW)) {
      let last = lines[lines.length - 1] || '';
      if (used < toks.length) last += '…';
      while (last.length > 1 && textW(last, fs, wt) > maxW) last = last.slice(0, -2) + '…';
      lines[lines.length - 1] = last;
      if (textW(last, fs, wt) > maxW) return null;
    }
    return lines;
  }
  function labelLayout(name, val, w, h) {
    const pad = Math.max(3, Math.min(8, Math.min(w, h) * 0.05));
    const iw = w - 2 * pad, ih = h - 2 * pad;
    if (iw < 16 || ih < 9) return null;
    for (let fs = Math.min(44, Math.max(8, Math.sqrt(w * h) / 7)); fs >= 7.5; fs = fs > 14 ? fs * 0.88 : fs - 1) {
      const vfs = Math.max(7.5, fs * 0.9);
      const vh = vfs * 1.15;
      if (textW(val, vfs, 400) > iw) continue;
      const maxLines = Math.floor((ih - vh - fs * 0.25) / (fs * 1.12));
      if (maxLines >= 1) {
        const lines = wrap(name, iw, fs, 400, Math.min(maxLines, 4));
        if (lines && lines[0] !== '…') return { pad, fs, vfs, lines };
      }
    }
    for (let vfs = Math.min(20, Math.max(7.5, Math.sqrt(w * h) / 7)); vfs >= 7.5; vfs -= 1) {
      if (textW(val, vfs, 400) <= iw && vfs * 1.15 <= ih) return { pad, fs: 0, vfs, lines: [] };
    }
    return null;
  }
  const tileValue = (r) => {
    if (st.mode === 'growth') {
      if (r.prev === null) return L().na;
      if (!r.prev) return L().isNew;
      return st.unit === 'pct' ? fmtGrowth(r.growth) : fmtSigned(r.change);
    }
    return st.unit === 'pct' ? fmtPct(r.share, r.share >= 0.1 ? 1 : 2) : fmtUsd(r.value);

  const tileFill = (r) => (st.mode === 'growth' ? (r.prev ? growthColor(r.growth) : r.prev === 0 ? '#23864b' : '#9aa0a6') : secColor(r.section));

  let firstDraw = true;
  function drawMap(fig, flow, H) {
    const box = fig.querySelector('.rj-tm');
    const W = Math.max(200, Math.floor(box.clientWidth));
    box.replaceChildren();
    box.style.minHeight = H + 'px';
    const rows = rowsFor(flow, effLevel()).filter((r) => r.value > 0);

      const e = el('div', 'rj-empty', L().noTrade); e.style.height = H + 'px';

      return;

    const tree = d3.hierarchy({ children: d3.groups(rows, (r) => r.section).map(([section, items]) => ({ section, children: items })) })
      .sum((d) => (d.children ? 0 : d.value)).sort((a, b) => b.value - a.value);
    d3.treemap().size([W, H]).paddingInner(1).round(true).tile(d3.treemapSquarify.ratio(1.15))(tree);

      .attr('role', 'img').attr('aria-label', fig.querySelector('.m-title').textContent)
      .classed('fresh', firstDraw).classed('dim', !!(selHere && rows.some((r) => r.code === st.sel.code)));

    g.each(function (d) {
      const w = d.x1 - d.x0, h = d.y1 - d.y0;
      const val = tileValue(d.data);
      const lay = labelLayout(nm(d.data), val, w, h);
      if (!lay) return;
      const ink = lum(tileFill(d.data)) > 0.6 ? '#1c1a14' : '#ffffff';
      const sel = d3.select(this);
      if (lay.lines.length) {
        const t = sel.append('text').attr('fill', ink).attr('font-size', lay.fs).attr('font-family', family);
        lay.lines.forEach((line, i) => t.append('tspan').attr('x', lay.pad).attr('y', lay.pad + lay.fs * 0.92 + i * lay.fs * 1.12).text(line));
      }
      sel.append('text').attr('fill', ink).attr('font-size', lay.vfs).attr('font-family', family).attr('x', lay.pad).attr('y', h - lay.pad - lay.vfs * 0.22).text(val);
    });

    const tip = el('div', 'rj-tip'); tip.hidden = true; box.append(tip);
    const show = (event, d) => {
      const r = d.data;
      const scale = box.clientWidth / W;
      const at = event.type === 'focus' ? [d.x0 * scale + 8, d.y0 * scale + 8] : d3.pointer(event, box);
      tip.replaceChildren();
      const line = (cls, text) => tip.append(el('div', cls, text));
      const pair = (k, v) => { const e = el('div', 'row'); e.append(el('span', 'k', k), el('span', '', v)); tip.append(e); };
      line('k', `HS${r.level}${L().sep}${r.code}${L().sep}${secName(r.section)}`);
      line('n', nm(r));
      pair(L().tValue, fmtUsd(r.value));
      pair(L().tShare, fmtPct(r.share, 2));
      const pp = idx.periods.get(idx.periods.get(st.period).prev);
      if (pp) { pair(L().tPrev(periodLabel(pp)), fmtUsd(r.prev || 0)); pair(L().tChange, r.prev ? `${fmtSigned(r.change)} (${fmtGrowth(r.growth)})` : L().newItem); }
      if (r.kg > 0) { pair(L().tKg, L().tons(fmtInt(r.kg / 1000))); pair(L().tPrice, L().perKg(fmtPrice(r.price))); }

      tip.style.top = Math.max(0, Math.min(bh - th, my + 14)) + 'px';

      .on('focus', show).on('blur', () => { tip.hidden = true; })

      });
  }

  function drawLegend() {

  // ---- monthly trend ----
  function drawTrend() {
    const box = $('#trend-chart');
    const t = dash.data('trade'), pr = dash.data('products');
    box.replaceChildren();
    $('#trend-title').textContent = st.sel ? L().trendSel : L().trendAll;
    if (t.status !== 'ok' || pr.status !== 'ok') {
      if (t.status === 'error' || pr.status === 'error') failed(box); else box.classList.add('dash-skeleton');
      return;
    }
    box.classList.remove('dash-skeleton');
    tradeIndex(t.data, pr.data);
    const test = scopeTest(null);
    const flows = st.sel ? [st.sel.flow] : ['ru_jp', 'jp_ru'];

    const months = tIdx.months;
    const sums = Object.fromEntries(flows.map((f) => [f, new Map(months.map((x) => [x, 0]))]));
    for (const f of flows) for (const r of tIdx.byFlow[f]) if (test(r)) sums[f].set(r.month, sums[f].get(r.month) + +r.value);
    const parse = (s) => new Date(s + '-01T00:00:00Z');

    const right = 10 + Math.min(W * 0.32, Math.max(...series.map((s) => textW(lastLabel(s), 12, 500))));

    }
    svg.append('g').selectAll('line').data(yt).join('line').attr('x1', left).attr('x2', W - right).attr('y1', (v) => y(v)).attr('y2', (v) => y(v)).attr('stroke', 'var(--cds-chart-grid)');
    svg.append('g').selectAll('text').data(yt).join('text').attr('x', left - 6).attr('y', (v) => y(v)).attr('dy', '0.32em')
      .attr('text-anchor', 'end').attr('fill', 'var(--color-fg-muted)').attr('font-size', 12).text(fmtUsd);
    const years = d3.utcYear.range(parse(months[0]), d3.utcMonth.offset(parse(months[months.length - 1]), 1));
    const step = Math.ceil(years.length / Math.max(1, Math.floor((W - left - right) / 48)));
    svg.append('g').selectAll('text').data(years.filter((_, i) => i % step === 0)).join('text')
      .attr('x', (d) => x(d)).attr('y', H - 8).attr('text-anchor', (d, i) => (i === 0 ? 'start' : 'middle'))
      .attr('fill', 'var(--color-fg-muted)').attr('font-size', 12).text((d) => d.getUTCFullYear());
    svg.append('line').attr('x1', left).attr('x2', W - right).attr('y1', y(0)).attr('y2', y(0)).attr('stroke', 'var(--cds-chart-axis)');
    const line = d3.line().x((d) => x(d.d)).y((d) => y(d.v));
    if (st.sel) {
      const area = d3.area().x((d) => x(d.d)).y0(y(0)).y1((d) => y(d.v));
      svg.append('path').attr('d', area(series[0].pts)).attr('fill', series[0].color).attr('opacity', 0.12);
    }
    series.forEach((s) => svg.append('path').attr('d', line(s.pts)).attr('fill', 'none').attr('stroke', s.color).attr('stroke-width', 2).attr('stroke-linejoin', 'round').attr('stroke-linecap', 'round'));
    const ends = series.map((s) => ({ s, y: y(s.pts[s.pts.length - 1].v) })).sort((a, b) => a.y - b.y);
    if (ends.length === 2 && ends[1].y - ends[0].y < 16) { const mid = Math.min(H - 42, Math.max(22, (ends[0].y + ends[1].y) / 2)); ends[0].y = mid - 8; ends[1].y = mid + 8; }
    ends.forEach((e) => { e.y = Math.min(H - 34, Math.max(14, e.y)); });
    ends.forEach((e) => {
      const lp = e.s.pts[e.s.pts.length - 1];

      const t2 = svg.append('text').attr('x', W - right + 8).attr('y', e.y).attr('dy', '0.32em').attr('font-size', 12).attr('font-weight', 500).attr('fill', e.s.color).text(lastLabel(e.s));

      .on('mousemove', (event) => {

  // ---- item card ----
  function portShares(test, flow, monthsSet) {
    if (!pIdx) return null;
    const by = new Map();
    for (const r of pIdx.byFlow[flow]) if (monthsSet.has(r.month) && test(r)) by.set(r.custom, (by.get(r.custom) || 0) + +r.value);
    const total = d3.sum(by.values());
    return { total, list: [...by.entries()].sort((a, b) => b[1] - a[1]).map(([c, v]) => ({ custom: c, v, share: total ? v / total : 0, off: pIdx.off.get(c) })) };
  }
  function drawItem() {
    const body = $('#item-body');
    body.replaceChildren();
    if (!st.sel) { body.append(el('p', 'rj-note', L().cardEmpty)); return; }

    const per = idx.periods.get(st.period), pl = periodLabel(per);
    body.append(el('div', 'code', `HS${s.level}${L().sep}${s.code}${L().sep}${flowName(s.flow)}`));

    const kv = el('dl', 'rj-kv');
    const pair = (k, v, mark) => { const dd = el('dd', '', v); if (mark) setMark(dd, mark[0], mark[1]); kv.append(el('dt', '', k), dd); };
    if (r) {
      pair(L().cValue(pl), fmtUsd(r.value), [r.key, 'value']);
      pair(L().cShare, fmtPct(r.share, 2), [r.key, 'share']);
      if (r.prev !== null) pair(L().cVsPrev, r.prev ? fmtGrowth(r.growth) : L().newItem, r.prev ? [r.key, 'growth'] : null);
    } else {
      pair(L().cValue(pl), '$0');
    }
    // quantity, unit price and regularity from the monthly rows
    const test = scopeTest(null);
    const monthsSet = new Set(per.src.split(','));
    let qty = 0, kg = 0, val = 0;
    const units = new Set();
    for (const t of tIdx.byFlow[s.flow]) {
      if (!monthsSet.has(t.month) || !test(t)) continue;
      val += +t.value; kg += +t.kg;
      if (t.unit) { qty += +t.qty; units.add(t.unit); }
    }
    if (units.size === 1 && qty > 0) {
      const u = unitName([...units][0]);
      pair(L().cQty, `${fmtInt(qty)} ${u}`);
      pair(L().cUnitPrice(u), '$' + fmtPrice(val / qty));
    }
    if (kg > 0) { pair(L().cKg, L().tons(fmtInt(kg / 1000))); pair(L().cKgPrice, '$' + fmtPrice(val / kg)); }
    const last12 = tIdx.months.slice(-12);
    const active = new Set();
    for (const t of tIdx.byFlow[s.flow]) if (t.month >= last12[0] && test(t) && +t.value > 0) active.add(t.month);
    pair(L().cActive, L().cActiveV(active.size));
    body.append(kv);
    // flags that say something about how many companies stand behind the number
    const flags = [];

    const ps = portShares(test, s.flow, monthsSet);
    const nPorts = ps ? ps.list.filter((p) => p.share >= 0.02).length : 0;
    if (active.size >= 11 && nPorts && nPorts <= 2) flags.push(L().fContract);
    else if (active.size > 0 && active.size <= 4) flags.push(L().fRare);
    if (ps && ps.list.length) {
      const top = ps.list.slice(0, 3).map((p) => `${p.off ? offName(p.off) : p.custom} ${fmtPct(p.share, 0)}`).join(st.lang === 'ja' ? '、' : ', ');

  // ---- ports ----
  function drawPorts() {
    const map = $('#port-map'), list = $('#port-list');
    const pd = dash.data('ports'), od = dash.data('offices'), bd = dash.data('basemap'), pr = dash.data('products');
    map.replaceChildren(); list.replaceChildren();
    if ([pd, od, bd, pr].some((d) => d.status !== 'ok') || !idx) {
      if ([pd, od, bd, pr].some((d) => d.status === 'error')) { failed(map); failed(list); } else map.classList.add('dash-skeleton');
      return;
    }
    map.classList.remove('dash-skeleton');
    portIndex(pd.data, od.data);
    if (!tIdx && dash.data('trade').status === 'ok') tradeIndex(dash.data('trade').data, pr.data);
    const per = idx.periods.get(st.period);
    const flow = st.sel ? st.sel.flow : st.portFlow;
    const monthsSet = new Set(per.src.split(','));
    const covered = per.src.split(',').filter((m) => m >= pIdx.months[0]).length;
    const y0 = pIdx.months[0].slice(0, 4);
    $('#port-note').textContent = L().portNote(scopeLabel(), flowName(flow), periodLabel(per)) + (covered < monthsSet.size ? L().portsFrom(y0, covered > 0) : '');
    if (!covered) { map.append(el('div', 'rj-empty', L().portsNone(y0))); return; }
    const test = scopeTest(flow);
    const ps = portShares(test, flow, monthsSet);
    // map
    const proj = bd.data.find((r) => r.country === '_proj');
    const lon0 = +proj.lon0, lon1 = +proj.lon1, lat0 = +proj.lat0, lat1 = +proj.lat1;
    const kx = +proj.w / (lon1 - lon0), ky = kx / Math.cos(((lat0 + lat1) / 2) * Math.PI / 180);
    const P = (lon, lat) => [(lon - lon0) * kx, (lat1 - lat) * ky];
    // show the main islands only: the basemap also covers the mainland coast, which carries no posts
    const [vx0, vy0] = P(Math.max(lon0, 128.6), Math.min(lat1, 45.9)), [vx1, vy1] = P(Math.min(lon1, 146.2), Math.max(lat0, 30.6));
    const svg = d3.select(map).append('svg').attr('width', '100%').attr('viewBox', `${vx0} ${vy0} ${vx1 - vx0} ${vy1 - vy0}`).attr('role', 'img').attr('aria-label', L().mapAria);
    svg.append('rect').attr('x', vx0).attr('y', vy0).attr('width', vx1 - vx0).attr('height', vy1 - vy0).attr('fill', 'var(--rj-sea)');
    bd.data.filter((r) => r.country !== '_proj').forEach((r) => svg.append('path').attr('d', r.d)
      .attr('fill', r.country === 'Япония' ? 'var(--rj-land)' : 'var(--rj-land-other)').attr('stroke', 'var(--color-border-line)').attr('stroke-width', 1.2));
    const pts = ps.list.filter((p) => p.off && p.off.lat && p.v > 0).map((p) => ({ ...p, xy: P(+p.off.lon, +p.off.lat) }))
      .filter((p) => p.xy[0] >= vx0 && p.xy[0] <= vx1 && p.xy[1] >= vy0 && p.xy[1] <= vy1);
    const maxV = d3.max(pts, (p) => p.v) || 1;
    const rad = (v) => 6 + Math.sqrt(v / maxV) * 58;
    const color = flowColor(flow);
    const tip = el('div', 'rj-tip'); tip.hidden = true; map.append(tip);
    const b = svg.append('g').selectAll('g').data([...pts].sort((a, c) => c.v - a.v)).join('g')
      .attr('class', (p) => 'rj-bubble' + (st.port === p.custom ? ' sel' : '')).attr('tabindex', 0).attr('role', 'button')
      .attr('aria-label', (p) => `${offName(p.off)}: ${fmtUsd(p.v)}`);
    b.append('circle').attr('cx', (p) => p.xy[0]).attr('cy', (p) => p.xy[1]).attr('r', (p) => rad(p.v)).attr('fill', color).attr('stroke', color);
    // labels for the biggest posts, skipping any that would collide
    const placed = [];
    pts.slice(0, 10).forEach((p) => {
      const label = offName(p.off);
      const w = textW(label, 23, 400), h = 26;
      const r0 = rad(p.v);
      let x0 = p.xy[0] + r0 + 6, anchor = 'start';
      if (x0 + w > vx1 - 6) { x0 = p.xy[0] - r0 - 6; anchor = 'end'; }
      const bb = anchor === 'start' ? [x0, p.xy[1] - h / 2, x0 + w, p.xy[1] + h / 2] : [x0 - w, p.xy[1] - h / 2, x0, p.xy[1] + h / 2];
      if (bb[0] < vx0 + 4 || bb[2] > vx1 - 4 || bb[1] < vy0 + 4 || bb[3] > vy1 - 4) return;
      if (placed.some((q) => !(bb[2] < q[0] || bb[0] > q[2] || bb[3] < q[1] || bb[1] > q[3]))) return;
      placed.push(bb);
      svg.append('text').attr('class', 'rj-plabel').attr('x', x0).attr('y', p.xy[1]).attr('dy', '0.35em').attr('text-anchor', anchor).text(label);
    });
    const showTip = (event, p) => {
      tip.replaceChildren(el('div', 'n', offName(p.off)), el('div', 'k', `${offKind(p.off)}, ${offHouse(p.off)}`));
      const row = (k, v) => { const e = el('div', 'row'); e.append(el('span', 'k', k), el('span', '', v)); tip.append(e); };
      row(L().tValue, fmtUsd(p.v)); row(L().tShareShort, fmtPct(p.share, 1));
      tip.append(el('div', 'k', L().portTip));
      tip.hidden = false;
      const scale = map.clientWidth / (vx1 - vx0);
      const [mx, my] = event.type === 'focus' ? [(p.xy[0] - vx0) * scale, (p.xy[1] - vy0) * scale] : d3.pointer(event, map);
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = Math.max(0, Math.min(map.clientWidth - tw, mx + 14)) + 'px';
      tip.style.top = Math.max(0, Math.min((vy1 - vy0) * scale - th, my + 14)) + 'px';
    };
    const pick = (p) => { st.port = st.port === p.custom ? null : p.custom; drawPorts(); };
    b.on('mousemove', showTip).on('focus', showTip).on('mouseleave blur', () => { tip.hidden = true; })
      .on('click', (event, p) => pick(p))
      .on('keydown', (event, p) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); pick(p); } });
    // list: posts, or the items going through the selected post
    const head = el('div', 'rj-plist-head');
    list.append(head);
    if (!ps.list.length) { head.append(el('h3', '', L().postsN(0))); list.append(el('p', 'rj-note', L().portsEmpty)); return; }
    const barRow = (name, sub, v, share, maxv, onClick, pressed, sw) => {
      const btn = el('button', 'rj-prow'); btn.type = 'button';
      if (pressed !== undefined) btn.setAttribute('aria-pressed', String(pressed));
      const nmEl = el('span', 'nm'); nmEl.append(document.createTextNode(name)); if (sub) nmEl.append(el('small', '', sub));
      const bar = el('span', 'bar'); const i = el('i'); i.style.width = Math.max(2, (v / maxv) * 100) + '%'; i.style.background = sw || color; bar.append(i);
      const vv = el('span', 'v', fmtUsd(v)); vv.append(el('small', '', fmtPct(share, 1)));
      btn.append(nmEl, bar, vv);
      btn.addEventListener('click', onClick);
      list.append(btn);
    };
    if (!st.port) {
      head.append(el('h3', '', L().postsN(ps.list.length)), el('span', 'rj-note', L().valueShare));
      const maxv = ps.list[0].v;
      ps.list.slice(0, 14).forEach((p) => barRow(p.off ? offName(p.off) : L().postX(p.custom), p.off ? `${offKind(p.off)}, ${offHouse(p.off)}` : '', p.v, p.share, maxv,
        () => { st.port = p.custom; drawPorts(); }, false));
    } else {
      const off = pIdx.off.get(st.port);
      const back = el('button', 'rj-link', L().allPosts); back.type = 'button';
      back.addEventListener('click', () => { st.port = null; drawPorts(); });
      head.append(el('h3', '', L().through(off ? offName(off) : st.port)), back);
      const by = new Map();
      for (const r of pIdx.byFlow[flow]) if (r.custom === st.port && monthsSet.has(r.month) && test(r)) by.set(r.hs9, (by.get(r.hs9) || 0) + +r.value);
      const tot = d3.sum(by.values());
      const items = [...by.entries()].sort((a, c) => c[1] - a[1]).slice(0, 14);
      const maxv = items.length ? items[0][1] : 1;
      items.forEach(([code, v]) => {
        const sec = tIdx && tIdx.sec.get(code.slice(0, 2));
        barRow(`${code} ${codeName(code, flow)}`, '', v, tot ? v / tot : 0, maxv, () => {
          const vr = idx.byKey.get(`${st.period}|${flow}|${code}`);
          if (vr) toggleSel(flow, vr);
        }, undefined, secColor(sec));
      });
    }
  }

  // ---- table ----
  function drawTable() {
    const tb = $('#table').querySelector('tbody');
    tb.replaceChildren();
    if (!idx || !st.period) return;
    const level = effLevel();
    let rows = rowsFor(st.tab, level).filter((r) => r.value > 0 || st.mode === 'growth');
    if (st.q) rows = rows.filter((r) => r.code.toLowerCase().includes(st.q) || LANGS.some((l) => (r['name_' + l] || '').toLowerCase().includes(st.q)));
    const key = st.sort, dir = st.dir;
    const val = (r) => (key === 'name' ? nm(r) : r[key]);
    const locale = { ru: 'ru', en: 'en', ja: 'ja' }[st.lang];
    rows.sort((a, b) => {
      const va = val(a), vb = val(b);
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      return typeof va === 'string' ? dir * va.localeCompare(vb, locale) : dir * (va - vb);
    });
    const shown = rows.slice(0, 400);
    for (const r of shown) {
      const tr = el('tr');
      tr.dataset.key = r.key;
      if (st.sel && st.sel.flow === r.flow && st.sel.code === r.code) tr.className = 'sel';
      const td = (text, cls) => { const c = el('td', cls, text); tr.append(c); return c; };
      const c0 = td('', 'l');
      const sw = el('i', 'rj-sw'); sw.style.background = secColor(r.section);
      c0.append(sw, document.createTextNode(r.code));
      if (drillable(r.code)) { const d = el('button', 'rj-drill', '▸'); d.type = 'button'; d.setAttribute('aria-label', L().drillAria(r.code)); c0.append(d); }
      td(nm(r), 'l name');
      td(fmtUsd(r.value));
      td(fmtPct(r.share, 2));
      td(r.prev === null ? L().na : fmtUsd(r.prev), 'opt');
      const ch = td(r.change === null ? L().na : fmtSigned(r.change), 'opt');
      const gr = td(r.prev === null ? L().na : r.prev === 0 ? L().isNew : fmtGrowth(r.growth));
      const sign = r.change > 0 ? 'rj-pos' : r.change < 0 ? 'rj-neg' : '';
      if (sign) { ch.classList.add(sign); gr.classList.add(sign); }
      td(r.kg > 0 ? fmtInt(r.kg / 1000) : '—', 'opt');
      td(r.price ? fmtPrice(r.price) : '—', 'opt');
      tb.append(tr);
    }
    $('#table').querySelectorAll('th').forEach((th) => {
      const b = th.querySelector('button');

    });

    $('#table-note').textContent = L().tableNote(flowName(st.tab), periodLabel(idx.periods.get(st.period)), fmtInt(shown.length), fmtInt(rows.length), st.mode === 'growth');
  }

  // ---- trade page ----
  function drawTrade() {
    const v = dash.data('views'), p = dash.data('periods'), b = dash.data('balance');
    const maps = [...root.querySelectorAll('.rj-map')];
    if (v.status !== 'ok' || p.status !== 'ok') {
      segs();
      if (v.status === 'error' || p.status === 'error') maps.forEach((f) => failed(f.querySelector('.rj-tm')));
      else maps.forEach((f) => f.querySelector('.rj-tm').classList.add('dash-skeleton'));
      compose($('#takeaway'), L().takeaway('—', M.tEx, M.tExg, M.tIm, M.tImg));
      drawTrend();
      return;
    }
    index(v.data, p.data);
    if (dash.data('trade').status === 'ok' && dash.data('products').status === 'ok') tradeIndex(dash.data('trade').data, dash.data('products').data);
    segs();

  function drawAbout() {

      sec.append(ul); body.append(sec);
    };
    A.sections.forEach(([h, items]) => list(h, items));
    list(A.linksTitle, A.links.map(([t, u]) => { const item = el('li'); const a = el('a', '', t); a.href = u; a.target = '_blank'; a.rel = 'noopener'; item.append(a); return item; }));
  }

  // ---- companies page ----
  const cst = { cat: '', region: '', q: '', sort: 'name', dir: 1 };
  const compName = (r) => (st.lang === 'ru' ? r.name : r.name_lat || r.name);
  const regionName = (code) => (REGION_T[+code] ? REGION_T[+code][li()] : code);
  const okvedName = (r) => (st.lang === 'ru' ? r.okved_name : (OKVED_T[r.okved] || [])[li()] || '');
  const objectsText = (r) => [...r.evidence.matchAll(/\(([^,()]+), (RU-[^)]+)\)/g)]
    .map((m) => `${(OBJ_KINDS[m[1]] || [m[1], m[1], m[1]])[li()]} ${m[2]}`).join(st.lang === 'ja' ? '、' : '; ');
  const codesOf = (r) => r.hs4.split(';').filter(Boolean);
  function companiesFor(code, flow) {
    const cd = dash.data('companies');
    if (cd.status !== 'ok' || code.includes('X') || code.startsWith('00')) return [];
    return cd.data.filter((r) => r.flow === flow && codesOf(r).some((h) => (code.length >= 4 ? h === code.slice(0, 4) : h.startsWith(code))));
  }
  $('#comp-cat').addEventListener('change', (e) => { cst.cat = e.target.value; drawCompanies(); });
  $('#comp-region').addEventListener('change', (e) => { cst.region = e.target.value; drawCompanies(); });
  $('#comp-search').addEventListener('input', (e) => { cst.q = e.target.value.trim().toLowerCase(); drawCompanies(); });
  $('#comp-table').querySelector('thead').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-csort]'); if (!b) return;
    if (cst.sort === b.dataset.csort) cst.dir = -cst.dir; else { cst.sort = b.dataset.csort; cst.dir = ['employees', 'since'].includes(cst.sort) ? -1 : 1; }
    drawCompanies();
  });
  $('#comp-table').querySelector('tbody').addEventListener('click', (e) => {
    const chip = e.target.closest('button.rj-chip');
    if (chip) { cst.cat = chip.dataset.code; drawCompanies(); }
  });
  function drawCompanies() {
    const cd = dash.data('companies');
    const tb = $('#comp-table').querySelector('tbody');
    tb.replaceChildren();
    $('#comp-sources-list').replaceChildren(...L().sources.map(([k, t]) => { const item = el('li'); item.append(el('b', '', k + ': '), document.createTextNode(t)); return item; }));
    if (cd.status !== 'ok') { if (cd.status === 'error') failed($('#comp-kpis')); return; }
    const all = cd.data;
    const codes = [...new Set(all.flatMap(codesOf))].sort();
    const chapters = [...new Set(codes.map((h) => h.slice(0, 2)))];
    const opts = [new Option(L().compAllCats, '')];
    chapters.forEach((ch) => {
      opts.push(new Option(L().chapterAll(ch, codeName(ch)), ch));
      codes.filter((h) => h.startsWith(ch)).forEach((h) => opts.push(new Option(`\u2003${h} ${codeName(h)}`, h)));
    });
    $('#comp-cat').replaceChildren(...opts);
    $('#comp-cat').value = cst.cat;
    const regions = [...new Set(all.map((r) => r.region_code))].sort((a, b) => regionName(a).localeCompare(regionName(b), st.lang));
    $('#comp-region').replaceChildren(new Option(L().compAllRegions, ''), ...regions.map((c) => new Option(regionName(c), c)));
    $('#comp-region').value = cst.region;
    let rows = all.filter((r) => (!cst.cat || codesOf(r).some((h) => h.startsWith(cst.cat))) && (!cst.region || r.region_code === cst.region));
    if (cst.q) rows = rows.filter((r) => [r.name, r.name_full, r.name_lat, r.inn].some((x) => (x || '').toLowerCase().includes(cst.q)));
    const key = {
      name: compName, inn: (r) => r.inn, region: (r) => regionName(r.region_code), hs4: (r) => codesOf(r)[0] || '',
      okved: (r) => r.okved, employees: (r) => +r.employees || 0, since: (r) => r.since, level: (r) => r.level,
    }[cst.sort];
    rows.sort((a, b) => { const va = key(a), vb = key(b); return typeof va === 'number' ? cst.dir * (va - vb) : cst.dir * String(va).localeCompare(String(vb), st.lang); });
    // headline figures
    const kpi = (v, label) => { const d = el('div', 'rj-kpi'); d.append(el('b', '', String(v)), el('span', '', label(v))); return d; };
    $('#comp-kpis').replaceChildren(kpi(rows.length, L().kCompanies), kpi(new Set(rows.flatMap(codesOf)).size, L().kCats),
      kpi(new Set(rows.map((r) => r.region_code)).size, L().kRegions), kpi(rows.filter((r) => r.sme).length, L().kSme));
    // how big the chosen category is in trade
    const vr = cst.cat && idx ? idx.byKey.get(`${st.period}|ru_jp|${cst.cat}`) : null;
    $('#comp-cat-note').textContent = cst.cat
      ? L().catNote(`${cst.cat} ${codeName(cst.cat, 'ru_jp')}`, fmtUsd(vr ? vr.value : 0), periodLabel(idx && idx.periods.get(st.period)))
      : L().catNoteAll(rows.length);
    if (!rows.length) { const tr = el('tr'); const td = el('td', 'l', L().compEmpty); td.colSpan = 8; tr.append(td); tb.append(tr); return; }
    for (const r of rows) {
      const tr = el('tr'); tr.dataset.key = r.inn;
      const td = (cls) => { const c = el('td', cls); tr.append(c); return c; };
      const c0 = td('l'); c0.append(document.createTextNode(compName(r)));
      if (st.lang === 'ru' && r.city) c0.append(el('small', '', r.city));
      const c1 = td('l nw');
      if (r.inn) { const a = el('a', '', r.inn); a.href = 'https://www.rusprofile.ru/search?query=' + r.inn; a.target = '_blank'; a.rel = 'noopener'; a.title = L().innLink; c1.append(a); }
      if (r.inn_check) { const w = el('small', 'rj-warn', L().innCheck); w.title = L().innCheckTip; c1.append(w); }
      td('l').textContent = regionName(r.region_code);
      const c3 = td('l');
      codesOf(r).forEach((h) => {
        const b = el('button', 'rj-chip'); b.type = 'button'; b.dataset.code = h;
        const i = el('i'); i.style.background = secColor(tIdx && tIdx.sec.get(h.slice(0, 2)));
        b.append(i, document.createTextNode(`${h} ${codeName(h, 'ru_jp')}`));
        c3.append(b);
      });
      td('l opt').textContent = r.okved ? `${r.okved} ${okvedName(r)}`.trim() : '—';
      const c5 = td('nw');
      c5.append(document.createTextNode(r.sme ? SME[r.sme][li()] : L().notSme));
      if (+r.employees) c5.append(el('small', '', L().employees(fmtInt(+r.employees))));
      const c6 = td('l');
      c6.append(document.createTextNode(L().evid({ ...r, objectsText: objectsText(r) })), el('small', '', L().since(r.since.slice(0, 4))));
      const c7 = td(''); const badge = el('span', 'rj-badge', L().levelA); badge.title = L().levelATip; c7.append(badge);
      tb.append(tr);
    }
    $('#comp-table').querySelectorAll('th').forEach((th) => {
      const b = th.querySelector('button');
      if (b.dataset.csort === cst.sort) th.setAttribute('aria-sort', cst.dir > 0 ? 'ascending' : 'descending'); else th.removeAttribute('aria-sort');
    });
  }

  applyLang();
  setPageVisibility();
  dash.onData(draw);
  // labels are fitted by measuring text, so measure again once the page fonts have loaded
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (idx) draw(); });
</script>
<script>window.__loadDashData();</script>
</body>
